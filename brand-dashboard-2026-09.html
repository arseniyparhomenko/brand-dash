        c === 0x1160 ||
        c === 0x180e ||
        (c >= 0x200b && c <= 0x200f) ||
        (c >= 0x202a && c <= 0x202e) ||
        (c >= 0x2060 && c <= 0x2064) ||
        (c >= 0x2066 && c <= 0x2069) ||
        c === 0x3164 ||
        c === 0xfeff ||
        (c >= 0xfff9 && c <= 0xfffb) ||
        c === 0xffa0 ||
        (c >= 0xe0000 && c <= 0xe007f)
      ) {
        return true;
      }
    }
    return false;
  }

  function escapeAttr(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  // Selector ladder: unique #id -> unique [data-*] -> structural
  // tag:nth-of-type path rooted at the nearest unique-id ancestor.
  function selectorFor(el) {
    if (el.id && !hasInvisibles(el.id) && isUnique("#" + CSS.escape(el.id))) {
      return "#" + CSS.escape(el.id);
    }
    for (var i = 0; i < el.attributes.length; i++) {
      var attr = el.attributes[i];
      if (
        attr.name.indexOf("data-") === 0 &&
        attr.value &&
        !hasInvisibles(attr.value)
      ) {
        var dataSel = "[" + attr.name + '="' + escapeAttr(attr.value) + '"]';
        if (isUnique(dataSel)) return dataSel;
      }
    }
    var parts = [];
    var cur = el;
    while (cur && cur !== document.body && cur.nodeType === 1 && parts.length < 10) {
      var sel = cur.tagName.toLowerCase();
      var parent = cur.parentElement;
      if (parent) {
        var sameTag = [];
        for (var c = 0; c < parent.children.length; c++) {
          if (parent.children[c].tagName === cur.tagName) sameTag.push(parent.children[c]);
        }
        if (sameTag.length > 1) {
          sel += ":nth-of-type(" + (sameTag.indexOf(cur) + 1) + ")";
        }
      }
      parts.unshift(sel);
      if (
        parent &&
        parent.id &&
        !hasInvisibles(parent.id) &&
        isUnique("#" + CSS.escape(parent.id))
      ) {
        parts.unshift("#" + CSS.escape(parent.id));
        return parts.join(" > ");
      }
      cur = parent;
    }
    if (cur === document.body) {
      parts.unshift("body");
      return parts.join(" > ");
    }
    // Depth cap hit without a root - an unrooted chain would match the
    // first structural pattern anywhere in the document. Mark the pin
    // detached instead of attaching it to the wrong element.
    return ":not(*)";
  }

  function descriptorFor(el) {
    var tag = "<" + el.tagName.toLowerCase() + ">";
    var idPart = el.id ? " #" + el.id : "";
    var text = visibleText(el).slice(0, 60);
    var textPart = text ? ' "' + text + '"' : "";
    // Nearest id'd ancestor, skipping the UCR-injected
    // #artifacts-component-root-* wrapper which is implementation noise.
    var section = el.parentElement;
    while (
      section &&
      (!section.id || section.id.indexOf("artifacts-component-root") === 0)
    ) {
      section = section.parentElement;
    }
    var sectionPart = section && section.id ? " in #" + section.id : "";
    return (tag + idPart + textPart + sectionPart).slice(0, 400);
  }

  // textContent offset of (node, offset) within body - the coordinate
  // system text-quote anchors are stored in. -1 when the boundary
  // isn't under body (shadow root, detached).
  function textOffset(node, offset) {
    var body = document.body;
    if (!body) return -1;
    try {
      var pre = document.createRange();
      pre.selectNodeContents(body);
      pre.setEnd(node, offset);
      return pre.toString().length;
    } catch (e) {
      return -1;
    }
  }

  // Inverse: build a Range covering [start, end) in body.textContent.
  function rangeForOffsets(start, end) {
    var body = document.body;
    if (!body) return null;
    var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    var acc = 0;
    var range = document.createRange();
    var haveStart = false;
    var t;
    while ((t = walker.nextNode())) {
      var next = acc + t.length;
      if (!haveStart && start < next) {
        range.setStart(t, start - acc);
        haveStart = true;
      }
      if (haveStart && end <= next) {
        range.setEnd(t, end - acc);
        return range;
      }
      acc = next;
    }
    return null;
  }

  // Context-scored search (W3C text-quote resolution): slice-check the
  // hint, else pick the occurrence whose surrounding chars best match
  // prefix/suffix. MIRRORS locateTextQuote() above line-for-line - the
  // tested export is the contract; this copy is what the sandbox runs.
  function locateQuote(text, q) {
    var ex = q.exact;
    if (!ex) return null;
    var hint = q.startOffset >= 0 ? q.startOffset : 0;
    if (text.slice(hint, hint + ex.length) === ex) {
      return { start: hint, end: hint + ex.length };
    }
    var best = -1;
    var bestScore = -1;
    var bestDist = Infinity;
    var scanned = 0;
    for (var idx = text.indexOf(ex); idx !== -1 && ++scanned <= 1000; idx = text.indexOf(ex, idx + 1)) {
      var before = text.slice(Math.max(0, idx - CONTEXT_LEN), idx);
      var after = text.slice(idx + ex.length, idx + ex.length + CONTEXT_LEN);
      var sc = 0;
      for (var i = 1; i <= q.prefix.length && i <= before.length; i++) {
        if (q.prefix[q.prefix.length - i] !== before[before.length - i]) break;
        sc++;
      }
      for (var j = 0; j < q.suffix.length && j < after.length; j++) {
        if (q.suffix[j] !== after[j]) break;
        sc++;
      }
      var dist = Math.abs(idx - hint);
      if (sc > bestScore || (sc === bestScore && dist < bestDist)) {
        best = idx;
        bestScore = sc;
        bestDist = dist;
      }
    }
    return best === -1 ? null : { start: best, end: best + ex.length };
  }

  function collectLineRects(range, cap) {
    var out = [];
    var rects = range.getClientRects();
    for (var i = 0; i < rects.length && out.length < cap; i++) {
      var r = rects[i];
      if (r.width > 0 && r.height > 0) {
        out.push({ x: r.left, y: r.top, w: r.width, h: r.height });
      }
    }
    return out;
  }

  function reportTextSel(full) {
    if (!port) return;
    var sel = window.getSelection();
    var r = sel && !sel.isCollapsed && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
    if (!r || !document.body || !document.body.contains(r.commonAncestorContainer)) {
      if (hasTextSel) {
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
      }
      return;
    }
    hasTextSel = true;
    var br = r.getBoundingClientRect();
    var msg = {
      type: "textCapture",
      rect: { x: br.left, y: br.top, w: br.width, h: br.height },
      lineRects: collectLineRects(r, 80),
    };
    if (full) {
      var live = document.body.textContent || "";
      var so = textOffset(r.startContainer, r.startOffset);
      var eo = textOffset(r.endContainer, r.endOffset);
      if (so < 0 || eo < 0 || eo <= so) {
        // Unanchorable selection (shadow root, foreign node). A
        // rect-only post here would make the host pair the new rect
        // with a stale prior anchor - clear instead.
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
        return;
      }
      // Denomination invariant: exact/prefix/suffix are byte-identical
      // slices of body.textContent. Truncation adjusts endOffset so
      // the host's (endOffset - startOffset === exact.length) shape
      // check holds. Cut points back off surrogate halves - a lone
      // surrogate would never relocate and fails UTF-8 persist.
      var capped = Math.min(eo, so + EXACT_CAP);
      if (capped < eo) {
        var hc = live.charCodeAt(capped - 1);
        if (hc >= 0xd800 && hc <= 0xdbff) capped--;
      }
      if (capped <= so) {
        port.postMessage(msg);
        return;
      }
      var pStart = Math.max(0, so - CONTEXT_LEN);
      var pc = live.charCodeAt(pStart);
      if (pc >= 0xdc00 && pc <= 0xdfff) pStart++;
      var sEnd = Math.min(live.length, capped + CONTEXT_LEN);
      if (sEnd < live.length) {
        var sc = live.charCodeAt(sEnd - 1);
        if (sc >= 0xd800 && sc <= 0xdbff) sEnd--;
      }
      msg.exact = live.slice(so, capped);
      msg.prefix = live.slice(pStart, so);
      msg.suffix = live.slice(capped, sEnd);
      msg.startOffset = so;
      msg.endOffset = capped;
    }
    port.postMessage(msg);
  }

  function clearSelection() {
    if (selected) {
      selected.classList.remove(SEL_CLASS);
      selected = null;
    }
  }

  // rAF-throttled cursor + hover-rect stream so the host can paint the
  // inspector hover box (and knows the pointer is present) in comment mode.
  var cursorPending = false;
  var cursorX = -1;
  var cursorY = -1;
  function flushCursor() {
    cursorPending = false;
    if (!port) return;
    var hover = null;
    if (
      hoverEl &&
      hoverEl.nodeType === 1 &&
      hoverEl !== document.body &&
      hoverEl !== document.documentElement
    ) {
      var r = hoverEl.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) {
        hover = { x: r.left, y: r.top, w: r.width, h: r.height };
      }
    }
    port.postMessage({ type: "cursor", x: cursorX, y: cursorY, hover: hover });
  }
  function scheduleCursor() {
    if (!cursorPending) {
      cursorPending = true;
      requestAnimationFrame(flushCursor);
    }
  }
  function onMouseMove(ev) {
    if (!mode || !port) return;
    // Over the scrollbar gutter (clientX/Y past the content box) - hide
    // the hover box like a leave.
    var de = document.documentElement;
    if (ev.clientX >= de.clientWidth || ev.clientY >= de.clientHeight) {
      cursorX = -1;
      cursorY = -1;
      hoverEl = null;
      scheduleCursor();
      return;
    }
    cursorX = ev.clientX;
    cursorY = ev.clientY;
    hoverEl = ev.target;
    scheduleCursor();
  }
  function onMouseLeave() {
    if (!mode || !port) return;
    cursorX = -1;
    cursorY = -1;
    hoverEl = null;
    scheduleCursor();
  }

  function onClick(ev) {
    if (!port) return;
    if (!mode) {
      // Mode off: don't intercept the page, just let the host close any
      // open popover (thread card click-away). A non-collapsed selection
      // means the click ended a drag-select - not a click-away.
      var s = window.getSelection();
      if (!s || s.isCollapsed) port.postMessage({ type: "clickAway" });
      return;
    }
    ev.preventDefault();
    ev.stopImmediatePropagation();
    var el = ev.target;
    if (!el || el.nodeType !== 1 || el === document.documentElement) return;
    if (el === document.body && el.firstElementChild) {
      // Pin on body is rarely intentional; keep it anyway but as body.
    }
    clearSelection();
    selected = el;
    el.classList.add(SEL_CLASS);
    var rect = el.getBoundingClientRect();
    var pinX = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0.5;
    var pinY = rect.height > 0 ? (ev.clientY - rect.top) / rect.height : 0.5;
    port.postMessage({
      type: "capture",
      selector: selectorFor(el).slice(0, 1000),
      textHint: visibleText(el).slice(0, 300),
      descriptor: descriptorFor(el),
      pinX: Math.min(1, Math.max(0, pinX)),
      pinY: Math.min(1, Math.max(0, pinY)),
      clientX: ev.clientX,
      clientY: ev.clientY,
      rectLeft: rect.left,
      rectTop: rect.top,
    });
  }

  function reportRects() {
    rafPending = false;
    if (!port) return;
    // Selected element's live bounds - keeps the host's draft pin /
    // inspector tag / composer glued through scroll and reflow.
    if (selected) {
      var sr = selected.getBoundingClientRect();
      port.postMessage({
        type: "selRect",
        left: sr.left,
        top: sr.top,
        w: sr.width,
        h: sr.height,
        found:
          (sr.width > 0 || sr.height > 0) &&
          document.documentElement.contains(selected),
      });
    }
    var rects = [];
    for (var i = 0; i < pins.length; i++) {
      var p = pins[i];
      var el = null;
      try {
        el = document.querySelector(p.selector);
      } catch (e) {
        el = null;
      }
      if (!el) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      rects.push({
        id: p.id,
        x: r.left + p.pinX * r.width,
        y: r.top + p.pinY * r.height,
        found: true,
      });
    }
    var quoteRects = [];
    if (quotes.length > 0) {
      var live = null;
      for (var qi = 0; qi < quotes.length; qi++) {
        var q = quotes[qi];
        var qr = quoteRanges[q.id];
        if (qr === undefined) {
          if (live === null) {
            live = (document.body && document.body.textContent) || "";
          }
          var loc = locateQuote(live, q);
          qr = (loc && rangeForOffsets(loc.start, loc.end)) || null;
          quoteRanges[q.id] = qr;
        }
        // Zero paintable rects (display:none subtree) reports as
        // not-found so the host docks it as detached instead of
        // rendering nothing clickable.
        var qlr = qr ? collectLineRects(qr, 80) : [];
        quoteRects.push(
          qlr.length > 0
            ? { id: q.id, found: true, lineRects: qlr }
            : { id: q.id, found: false, lineRects: [] }
        );
      }
    }
    port.postMessage({
      type: "rects",
      rects: rects,
      quoteRects: quoteRects,
      scrollY: window.scrollY || 0,
    });
  }

  function scheduleRects() {
    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;
      reportRects();
    }
    // rAF for paint alignment, with a timeout fallback - rAF is
    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  function setMode(on) {
    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);
    if (!mode) {
      hoverEl = null;
      clearSelection();
    }
  }

  function setComposing(open) {
    document.documentElement.toggleAttribute("data-cwhr-composing", !!open);
  }

  function onPortMessage(ev) {
    var data = ev.data;
    if (!data) return;
    if (data.type === "mode") setMode(data.on);
    else if (data.type === "composing") setComposing(data.open);
    else if (data.type === "pins") {
      pins = Array.isArray(data.pins) ? data.pins : [];
      scheduleRects();
    } else if (data.type === "quotes") {
      quotes = Array.isArray(data.quotes) ? data.quotes : [];
      quoteRanges = Object.create(null);
      scheduleRects();
    } else if (data.type === "clearSelection") {
      clearSelection();
    } else if (data.type === "clearTextSel") {
      var ts = window.getSelection();
      if (ts) ts.removeAllRanges();
      hasTextSel = false;
    } else if (data.type === "restoreScroll") {
      var ry = Number(data.y);
      if (isFinite(ry) && ry > 0) {
        // Apply now and again at load - late images/fonts can grow the
        // document after the first attempt clamps short.
        window.scrollTo(0, ry);
        window.addEventListener("load", function () {
          window.scrollTo(0, ry);
        });
      }
    }
  }

  function start() {
    injectStyle();
    var channel = new _MessageChannel();
    port = channel.port1;
    port.onmessage = onPortMessage;
    // Sandboxed srcdoc origins can be opaque; "*" is required. The
    // payload carries only the mount token (multiple sandboxes can be
    // mounted at once - the token routes the port to the right overlay)
    // and the channel port itself is pairwise-secure.
    _topPost(
      { type: READY_TYPE, token: "208ed178-b42c-4824-8be9-0c8f34295d0c" },
      "*",
      [channel.port2]
    );
    document.addEventListener("mousemove", onMouseMove, true);
    // documentElement (not document, capture) so this fires only when the
    // pointer leaves the viewport - capture-phase on document would fire for
    // every intra-document element-boundary crossing.
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.addEventListener("click", onClick, true);
    // Text-selection capture: commit on mouseup/keyup (Shift+Arrow),
    // clear on collapse. Not mode-gated; highlight-to-comment is
    // always on.
    function onSelCommit() { reportTextSel(true); }
    document.addEventListener("mouseup", onSelCommit, true);
    document.addEventListener("keyup", onSelCommit, true);
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (hasTextSel && (!s || s.isCollapsed)) reportTextSel(false);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });
    }, true);
    // Scroll/resize move the hovered element under a stationary pointer -
    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);
      });
    }
    function onLayoutChange() {
      scheduleRects();
      if (mode && hoverEl) scheduleCursor();
      if (hasTextSel) scheduleTextSel();
    }
    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);
    // Full-cache invalidate per childList mutation is acceptable: CSS
    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();
    });
    function observe() {
      if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) observe();
    else document.addEventListener("DOMContentLoaded", observe);
    // Settle pins after late layout (fonts, images).
    setInterval(scheduleRects, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Performance Dashboard</title>
<style>
  :root{
    --bg:#f4f2ec; --card:#ffffff; --ink:#17181a; --ink-soft:#575149; --ink-faint:#948d83;
    --line:rgba(23,24,26,.11); --line-soft:rgba(23,24,26,.055);
    --accent:#17706b; --accent-soft:rgba(23,112,107,.10);
    --up:#1a7a4a; --down:#c0432f; --amber:#b4762e; --neutral:#7b7570;
    --s2:#b4762e; --s3:#5f6bb0; --s4:#a8497b; --s5:#5a8f57;
    --radius:13px;
  }
  body.geo-mm{ --accent:#b0552b; --accent-soft:rgba(176,85,43,.10); }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:15px;}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;letter-spacing:-.01em;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 70px;}

  /* ---------- header ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(244,242,236,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);}
  .topbar .inner{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;margin-right:auto;}
  .brand .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  .brand h1{font-size:19px;margin:1px 0 0;}
  .ctrl{display:flex;align-items:center;gap:8px;}
  select,.btn{font:inherit;font-size:13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);padding:7px 11px;cursor:pointer;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .btn.primary:hover{opacity:.9;color:#fff;}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink-soft);
    padding:6px 14px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 22px;}
  .tabs button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--ink-faint);
    padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tabs button:hover{color:var(--ink);}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent);}

  /* ---------- generic blocks ---------- */
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;}
  .sec-head h2{font-size:20px;margin:0;}
  .sec-head .hint{font-size:12.5px;color:var(--ink-faint);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:15px;}
  .grid .full{grid-column:1/-1;}
  .card h3{font-size:14.5px;margin:0 0 12px;}
  .stack{display:flex;flex-direction:column;gap:15px;}

  /* ---------- kpi ---------- */
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px 14px;}
  .hcard .l{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);}
  .hcard .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:9px;}
  .hcard .v{font-size:33px;font-weight:700;letter-spacing:-.025em;line-height:1;}
  .hcard .spark{width:96px;height:32px;flex:0 0 96px;}
  .hcard .d{font-size:13px;font-weight:700;margin-top:8px;}
  .hcard .pv{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .movers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px;}
  @media(max-width:760px){.movers{grid-template-columns:1fr;}}

  .work .w .v{font-size:19px;font-weight:700;margin-top:5px;line-height:1.25;}

  .kpi .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.02em;}
  .kpi .d{font-size:12px;font-weight:700;margin-top:4px;display:inline-flex;gap:4px;align-items:center;}
  .kpi .pv{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .d.up{color:var(--up);} .d.down{color:var(--down);} .d.flat{color:var(--ink-faint);}

    padding-bottom:5px;border-bottom:1px solid var(--line);}
  thead th.mhead.mcur{color:var(--accent);}
  tfoot td.mcur{background:var(--accent-soft);}
  .t-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    font-weight:800;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  td.name{font-weight:600;min-width:130px;}
  tfoot td{padding:9px;font-weight:700;border-top:1.5px solid var(--line);font-size:13px;}
  .roi-pos{color:var(--up);font-weight:700;}
  .roi-neg{color:var(--down);font-weight:700;}
  .dmini{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;}
  .dmini.up{color:var(--up);} .dmini.down{color:var(--down);} .dmini.flat{color:var(--ink-faint);}
  .dmini.new{color:var(--accent);}
  .rowdel{visibility:hidden;border:0;background:transparent;color:var(--down);cursor:pointer;font-size:15px;padding:0 4px;}
  body.editing .rowdel{visibility:visible;}

  /* ---------- retention ---------- */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
  @media(max-width:760px){.two{grid-template-columns:1fr;}}
  .lst{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.55;}
  .lst li{padding:7px 0 7px 20px;border-bottom:1px solid var(--line-soft);position:relative;}
  .lst li:last-child{border-bottom:none;}
  .lst.good li::before{content:"▲";position:absolute;left:0;color:var(--up);font-size:10px;top:10px;}
  .lst.bad li::before{content:"▼";position:absolute;left:0;color:var(--down);font-size:10px;top:10px;}

  /* ---------- signature: loop card ---------- */
  .loop{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;}
  .loop .lp-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);
    background:var(--accent-soft);}
  .loop .lp-h .n{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;}
  .lp-step{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line-soft);}
  .lp-step:last-child{border-bottom:none;}
  .lp-step .k{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding-top:2px;}
  .lp-step .val{font-size:13.5px;line-height:1.55;}
  .lp-step.next{background:rgba(23,24,26,.025);}
  .lp-step.next .k{color:var(--accent);}
  .lp-step.next .k::before{content:"↺ ";}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 10px;font-weight:600;}

  /* ---------- signature: project rail ---------- */
  .proj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;}
  .proj .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px;}
  .proj .ph h3{margin:0;font-size:16px;}
  .rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0;}
  @media(max-width:900px){.rail{grid-template-columns:1fr;}}
  .rail .st{position:relative;padding:0 16px 0 0;}
  .rail .st:not(:last-child)::after{content:"→";position:absolute;right:2px;top:22px;color:var(--ink-faint);font-size:13px;}
  @media(max-width:900px){
    .rail .st{padding:0 0 14px;}
    .rail .st:not(:last-child)::after{content:"↓";right:auto;left:0;top:auto;bottom:-1px;}
    .rail .st{padding-left:16px;}
  }
  .rail .st .k{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);
    padding-bottom:6px;margin-bottom:8px;border-bottom:2px solid var(--line);}
  .rail .st:nth-child(3) .k{border-bottom-color:var(--accent);color:var(--accent);}
  .rail .st .val{font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink-soft);}
  .badge.done{background:rgba(26,122,74,.10);color:var(--up);border-color:transparent;}
  .badge.run{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .badge.plan{background:rgba(180,118,46,.12);color:var(--amber);border-color:transparent;}
  .badge.stop{background:rgba(192,67,47,.10);color:var(--down);border-color:transparent;}

  /* ---------- charts ---------- */
  .hbars{display:flex;flex-direction:column;gap:3px;padding:2px 0 6px;}
  .hbar{display:flex;align-items:center;gap:11px;font-size:12.5px;}
  .hbar .nm{flex:0 0 42%;max-width:42%;color:var(--ink);font-weight:600;line-height:1.35;

  .hbar .track{flex:1;height:17px;background:var(--line-soft);border-radius:4px;overflow:hidden;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--ink-soft);}

  /* ---------- editing ---------- */

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function fmt(v,unit){
  if(v===null||v===undefined||v==='') return '—';
  if(typeof v!=='number'||isNaN(v)) return String(v);
  if(unit==='%'){ var t=(v*100).toFixed(2).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,''); return t+'%'; }
  var abs=Math.abs(v), s;
  s = abs>=1000 ? Math.round(v).toLocaleString('ru-RU').replace(/\u00a0/g,' ')
                : (Math.round(v*100)/100).toString();
  return unit==='$' ? '$'+s : (unit ? s+' '+unit : s);
}
function parseNum(t){
  if(t==null) return null;
  var s=String(t).replace(/\s|\u00a0|\$|₴/g,'').replace(',', '.').replace(/[^\d.\-]/g,'');
  if(s==='' ) return null;
  var n=parseFloat(s); return isNaN(n)?null:n;
}
function getPath(p){
  var parts=p.split('.'), o=D;
  for(var i=0;i<parts.length;i++){ if(o==null) return null; o=o[parts[i]]; }
  return o;
}
function setPath(p,val){
  var parts=p.split('.'), o=D;
  for(var i=0;i<parts.length-1;i++){
    if(o[parts[i]]==null) o[parts[i]] = /^\d+$/.test(parts[i+1]) ? [] : {};
    o=o[parts[i]];
  }
  o[parts[parts.length-1]]=val;
}
function base(){ return 'data.'+STATE.geo+'.'+STATE.month; }
function cur(){
  var g=D.data[STATE.geo]||{}; 
  return g[STATE.month] || null;
}
function prevMonthId(){
  var i=D.months.map(function(m){return m.id;}).indexOf(STATE.month);
  return i>0 ? D.months[i-1].id : null;
}
function prevData(){
  var pm=prevMonthId(); if(!pm) return null;
  return (D.data[STATE.geo]||{})[pm]||null;
}
function monthLabel(id){
  var m=D.months.filter(function(x){return x.id===id;})[0];
  return m?m.label:id;
}
function geoName(id){
  var g=D.geos.filter(function(x){return x.id===id;})[0];
  return g?g.name:id;
}
/* editable cell */
function ed(path,value,unit,cls){
  var isText = (unit==='text'||unit===undefined);
  var disp = isText ? esc(value==null?'':value) : fmt(value,unit);
  var type = isText ? 'text' : (unit==='%' ? 'pct' : 'num');
  return '<span data-path="'+esc(path)+'" data-type="'+type+'" class="'+(cls||'')+'">'+disp+'</span>';
}
function delta(c,p,better){
  if(typeof c!=='number'||typeof p!=='number'||p===0) return '';
  var dp=(c-p)/Math.abs(p), up=c>=p, good = better==='down' ? !up : up;
  var flat=Math.abs(dp)<0.001, cls=flat?'flat':(good?'up':'down'), ar=flat?'→':(up?'▲':'▼');
  var dv=(Math.abs(dp)*100).toFixed(1).replace(/\.0$/,'');
  return '<div class="d '+cls+'">'+ar+' '+dv+'%</div>';
}
function statusBadge(s){
  var t=(s||'').toLowerCase(), c='';
  if(t.indexOf('сработ')>=0||t.indexOf('готов')>=0||t.indexOf('успеш')>=0) c='done';
  else if(t.indexOf('работ')>=0||t.indexOf('запущ')>=0||t.indexOf('тест')>=0||t.indexOf('частич')>=0) c='run';
  else if(t.indexOf('план')>=0) c='plan';
  else if(t.indexOf('не помог')>=0||t.indexOf('отмен')>=0||t.indexOf('стоп')>=0) c='stop';
  return '<span class="badge '+c+'">'+esc(s||'—')+'</span>';
}

/* ---------- chart ---------- */
function chart(ch){
  var W=560,H=200,padL=52,padR=14,padT=10,padB=26;
  var xs=ch.x||[], series=ch.series||[];
  var all=[]; series.forEach(function(s){ s.data.forEach(function(v){ if(typeof v==='number'&&!isNaN(v)) all.push(v); }); });
  if(!all.length) return '<div class="empty">нет данных</div>';
  var max=Math.max.apply(null,all.concat([0])), min=Math.min.apply(null,all.concat([0]));
  if(max===min) max=min+1;
  var iw=W-padL-padR, ih=H-padT-padB;
  var X=function(i){ return padL+(xs.length<=1? iw/2 : (i/(xs.length-1))*iw); };
  var Y=function(v){ return padT+ih-((v-min)/(max-min))*ih; };
  var grid='',yl='';
  for(var t=0;t<=4;t++){
    var val=min+(max-min)*t/4, y=Y(val);
    grid+='<line class="grid-l" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    yl+='<text class="axis-t" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+esc(shortNum(val,ch.unit))+'</text>';
  }
  var xl='';
  xs.forEach(function(x,i){ xl+='<text class="axis-t" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x)+'</text>'; });
  var body='';
  if(ch.type==='bar'){
    var g=xs.length, sc=series.length, bw=iw/Math.max(1,g)/(sc+0.5);
    series.forEach(function(s,si){
      var c=COLORS[si%COLORS.length];
      s.data.forEach(function(v,i){
        if(typeof v!=='number'||isNaN(v)) return;
        var x=padL+(i+0.15)/Math.max(1,g)*iw+si*bw, y=Y(Math.max(v,min)), h=Y(min)-y;
        body+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.9).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="2" fill="'+c+'"><title>'+esc(s.name)+' · '+esc(xs[i])+': '+fmt(v,ch.unit)+'</title></rect>';
      });
    });
  } else {
    series.forEach(function(s,si){
      var c=COLORS[si%COLORS.length], d='', on=false;
      s.data.forEach(function(v,i){
        if(typeof v!=='number'||isNaN(v)){ on=false; return; }
        d+=(on?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; on=true;
      });
      body+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
      s.data.forEach(function(v,i){
        if(typeof v!=='number'||isNaN(v)) return;
        body+='<circle class="dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.4" fill="'+c+'"><title>'+esc(s.name)+' · '+esc(xs[i])+': '+fmt(v,ch.unit)+'</title></circle>';
      });
    });
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'+grid+yl+xl+body+'</svg>';
}
function shortNum(v,unit){
  if(unit==='%') return (v*100).toFixed(0)+'%';
  var a=Math.abs(v);
  if(a>=1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1000) return Math.round(v/1000)+'k';
  return (Math.round(v*100)/100).toString();
}
function hbars(items, color){
  var vals=items.map(function(i){return typeof i.value==='number'?i.value:0;});
  var max=Math.max.apply(null,vals.concat([0]));
  if(!max) return '<div class="empty">нет данных</div>';
  var sorted=items.slice().sort(function(a,b){ return (b.value||0)-(a.value||0); });
  return '<div class="hbars">'+sorted.map(function(i){
    var v=typeof i.value==='number'?i.value:0;
    var w=Math.max(0.5,(v/max)*100);
    return '<div class="hbar"><div class="nm" title="'+esc(i.name)+'">'+esc(i.name)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+w.toFixed(1)+'%;background:'+color+'"></div></div>'+
      '<div class="v">'+fmt(v,'')+'</div></div>';
  }).join('')+'</div>';
}
function legend(series){
  if(!series||series.length<2) return '';
  return '<div class="legend">'+series.map(function(s,i){
    return '<span><i style="background:'+COLORS[i%COLORS.length]+'"></i>'+esc(s.name)+'</span>';
  }).join('')+'</div>';
}
function seriesOverMonths(geo,pick){
  return D.months.map(function(m){
    var o=(D.data[geo]||{})[m.id];
    var v = o ? pick(o) : null;
    return (typeof v==='number')?v:null;
  });
}

  return (g&&g.sendMode)||'volume';
}
function unk(){ return '<span style="color:var(--ink-faint);font-size:12px">не известно</span>'; }

  var body=rows.map(function(x,i){
    var rb=b+'.'+key+'.'+i;
    var cells = cr
      ? '<td class="num">'+ed(rb+'.pm',x.pm,'%')+'</td>'+
        '<td class="num">'+ed(rb+'.push',x.push,'%')+'</td>'+
        '<td class="num">'+((typeof x.emailOR==='number'||STATE.editing)
            ? ed(rb+'.emailOR',(typeof x.emailOR==='number'?x.emailOR:null),'%') : unk())+'</td>'+
        '<td class="num">'+((typeof x.emailCR==='number'||STATE.editing)
            ? ed(rb+'.emailCR',(typeof x.emailCR==='number'?x.emailCR:null),'%') : unk())+'</td>'
      : '<td>'+ed(rb+'.channel',x.channel,'text')+'</td>'+
        '<td class="num">'+ed(rb+'.sent',x.sent,'')+'</td>'+
        '<td class="num">'+ed(rb+'.cr',x.cr,'%')+'</td>'+
        '<td class="num">'+ed(rb+'.clicks',x.clicks,'')+'</td>';
    return '<tr><td class="name">'+(i+1)+'. '+ed(rb+'.name',x.name,'text')+'</td>'+cells+
      '<td><button class="rowdel" data-del="'+b+'.'+key+'|'+i+'">×</button></td></tr>';
  }).join('');
  return '<div class="card full" style="margin-top:15px"><h3>'+esc(title)+'</h3><div class="t-wrap"><table>'+
    '<thead>'+head+'</thead><tbody>'+
    (body||'<tr><td colspan="6" class="empty">Данных пока нет — включите правку и добавьте строки</td></tr>')+
    '</tbody></table></div><button class="btn addrow" data-add="'+key+'">+ Добавить строку</button></div>';
}

    '<div class="t-wrap"><table><thead><tr><th>Вертикаль</th><th>Сегмент</th><th>Неактивность</th>'+
    '<th class="num">База таргет</th><th class="num">Активировано</th><th class="num">CTR таргет</th>'+
    '<th class="num">ARPPU таргет</th><th class="num">Экстра профит</th><th></th></tr></thead><tbody>'+
    (body||'<tr><td colspan="9" class="empty">Кампаний реактивации за месяц не было</td></tr>')+'</tbody>'+
    (rows.length?'<tfoot><tr><td>Итого</td><td></td><td></td><td class="num">'+fmt(t.base,'')+
      '</td><td class="num">'+fmt(t.act,'')+'</td><td class="num">'+(tctr==null?'—':fmt(tctr,'%'))+
      '</td><td class="num"></td><td class="num">'+fmt(t.profit,'')+'</td><td></td></tr></tfoot>':'')+
    '</table></div><button class="btn addrow" data-add="reactivation">+ Добавить строку</button></div>';

function smmBlock(c){
  var rows=c.smm||[];
  if(!rows.length && !STATE.editing) return '';
  var b=base();
  var pm=prevData(), pSmm=(pm&&pm.smm)||[];
  var M=[{k:'followers',l:'Подписчики'},{k:'reach',l:'Охват'},{k:'posts',l:'Постов'},
         {k:'reactions',l:'Реакций'}];
  var body=rows.map(function(x,i){
    var rb=b+'.smm.'+i;
    var prev=null;
    (pSmm||[]).forEach(function(y){ if(y.network===x.network) prev=y; });
    var cells=M.map(function(mt){
      var o=x[mt.k]||{}, f=num(o.fact);
      var pv=(prev&&prev[mt.k])?num(prev[mt.k].fact):null;
      var d='';
      if(typeof f==='number'&&typeof pv==='number'&&pv!==0){
        var dp=(f-pv)/Math.abs(pv), a=Math.abs(dp)*100;
        if(a<0.5) d='<span class="dmini flat">→</span>';
        else d='<span class="dmini '+(dp>0?'up':'down')+'">'+(dp>0?'▲':'▼')+
          (a<10?(Math.round(a*10)/10):Math.round(a))+'%</span>';
      }
      return '<td class="num">'+ed(rb+'.'+mt.k+'.fact',o.fact,'')+' '+d+'</td>';
    }).join('');
    return '<tr><td class="name">'+ed(rb+'.network',x.network,'text')+'</td>'+cells+
      '<td><button class="rowdel" data-del="'+b+'.smm|'+i+'">×</button></td></tr>';
  }).join('');
  return '<div class="card full" style="margin-top:15px"><h3>СММ · '+esc(monthLabel(STATE.month))+'</h3>'+
    '<div style="font-size:12px;color:var(--ink-faint);margin:-6px 0 10px">Факт за месяц. Стрелка — изменение к предыдущему месяцу</div>'+
    '<div class="t-wrap"><table><thead><tr><th>Площадка</th>'+
    M.map(function(mt){ return '<th class="num">'+esc(mt.l)+'</th>'; }).join('')+
    '<th></th></tr></thead><tbody>'+
    (body||'<tr><td colspan="6" class="empty">За месяц пусто — включите правку и добавьте площадку</td></tr>')+
    '</tbody></table></div><button class="btn addrow" data-add="smm">+ Добавить площадку</button></div>';
}

function topSendsBlock(c){
  var r=(c.retention||{}), T=r.topSends||{}, b=base();
  var all=[];
  ['pm','push','email'].forEach(function(k){
    (T[k]||[]).forEach(function(o,i){
      var dl=num(o.delivered), rd=num(o.read);
      all.push({o:o, path:b+'.retention.topSends.'+k+'.'+i, del:b+'.retention.topSends.'+k+'|'+i,
                or:(dl>0&&typeof rd==='number')?rd/dl:null});
    });
  });
  if(!all.length && !STATE.editing) return '';
  all.sort(function(a,z){ return (z.or||0)-(a.or||0); });
  var body=all.slice(0,5).map(function(x,n){
    var o=x.o, rb=x.path;
    return '<tr><td class="num" style="color:var(--ink-faint)">'+(n+1)+'</td>'+
      '<td>'+ed(rb+'.date',o.date,'text')+'</td>'+
      '<td class="name">'+ed(rb+'.name',o.name,'text')+'</td>'+
      '<td class="num">'+ed(rb+'.delivered',o.delivered,'')+'</td>'+
      '<td class="num">'+ed(rb+'.read',o.read,'')+'</td>'+
      '<td class="num"><b>'+(x.or==null?'—':fmt(x.or,'%'))+'</b></td>'+
      '<td><button class="rowdel" data-del="'+x.del+'">×</button></td></tr>';
  }).join('');
  return '<div class="card full" style="margin-top:15px"><h3>ТОП-5 рассылок · '+esc(monthLabel(STATE.month))+'</h3>'+
    '<div style="font-size:12px;color:var(--ink-faint);margin:-6px 0 10px">Все каналы вместе, по убыванию процента. Считается само: PM/Email — Open Rate (прочитано / доставлено), Push — CTR (клики / отправлено)</div>'+
    '<div class="t-wrap"><table><thead><tr><th class="num">#</th><th>Дата</th><th>Кампания</th>'+
    '<th class="num">Доставлено</th><th class="num">Прочитано / кликов</th><th class="num">OR / CTR</th><th></th></tr></thead><tbody>'+
    (body||'<tr><td colspan="7" class="empty">Нет данных</td></tr>')+'</tbody></table></div>'+
    '<button class="btn addrow" data-add="topsend:pm">+ Добавить рассылку</button></div>';
}

function retBlock(c){
  var r=c.retention||{}, ss=r.sendStats||[], fn=r.funnel||[];
  if(!ss.length && !fn.length && !STATE.editing) return '';
  var b=base(), tS=0,tC=0;
  var body=ss.map(function(x,i){
    var sb=b+'.retention.sendStats.'+i;
    var sent=num(x.sent), cl=num(x.clicks);
    var cr=(sent>0&&typeof cl==='number')?cl/sent:null;
    tS+=sent||0; tC+=cl||0;
    return '<tr><td class="name">'+ed(sb+'.channel',x.channel,'text')+'</td>'+
      '<td class="num">'+ed(sb+'.sent',x.sent,'')+'</td>'+
      '<td class="num">'+ed(sb+'.clicks',x.clicks,'')+'</td>'+
      '<td class="num">'+(cr==null?'—':fmt(cr,'%'))+'</td>'+
      '<td><button class="rowdel" data-del="'+b+'.retention.sendStats|'+i+'">×</button></td></tr>';
  }).join('');
  var tCr = tS>0 ? tC/tS : null;

  var html='<div class="card full" style="margin-top:15px"><h3>Ретеншен · '+esc(monthLabel(STATE.month))+'</h3>';
  if(r.campaigns!=null||STATE.editing)
    html+='<div style="font-size:13px;color:var(--ink-soft);margin:-6px 0 10px">Кампаний за месяц: <b>'+
      ed(b+'.retention.campaigns',r.campaigns,'')+'</b></div>';
  if(ss.length||STATE.editing){
    html+='<div class="t-wrap"><table><thead><tr><th>Канал</th><th class="num">Отправлено</th>'+
      '<th class="num">Кликов</th><th class="num">CR</th><th></th></tr></thead><tbody>'+
      (body||'<tr><td colspan="5" class="empty">Нет данных по каналам</td></tr>')+'</tbody>'+
      (ss.length?'<tfoot><tr><td>Итого</td><td class="num">'+fmt(tS,'')+'</td><td class="num">'+fmt(tC,'')+
        '</td><td class="num">'+(tCr==null?'—':fmt(tCr,'%'))+'</td><td></td></tr></tfoot>':'')+
      '</table></div><button class="btn addrow" data-add="sendstat">+ Добавить канал</button>';
  }
  if(fn.length){
    html+='<div style="margin-top:14px"><div style="font-size:11px;font-weight:800;letter-spacing:.06em;'+
      'text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px">'+esc(r.funnelTitle||'Deposit Funnel')+'</div>'+
      '<div class="t-wrap"><table><thead><tr>'+
      fn.map(function(x){ return '<th class="num">'+esc(x.stage)+'</th>'; }).join('')+
      '</tr></thead><tbody><tr>'+
      fn.map(function(x,i){ return '<td class="num">'+ed(b+'.retention.funnel.'+i+'.value',x.value,'%')+'</td>'; }).join('')+
      '</tr></tbody></table></div></div>';
  }
  if(r.base||STATE.editing)
    html+='<div style="margin-top:10px;font-size:12.5px;color:var(--ink-faint);line-height:1.5">'+
      ed(b+'.retention.base',r.base,'text')+'</div>';
  return html+'</div>';
}

function secTotals(){
  var c=cur(), p=prevData();
  if(!c) return emptyMonth();
  var html='<div class="sec-head"><h2>Main Board</h2><div class="hint">'+esc(geoName(STATE.geo))+' · '+esc(monthLabel(STATE.month))+(p?' · сравнение с '+esc(monthLabel(prevMonthId())):'')+'</div></div>';
  var ids=D.months.map(function(m){ return m.id; });
  var cut=ids.indexOf(STATE.month);
  html+='<div class="kpis">'+TOTAL_FIELDS.map(function(f){
    var v=c.totals?c.totals[f.k]:null, pv=null, pvMid=null;
    for(var i=cut-1;i>=0;i--){
      var o=(D.data[STATE.geo]||{})[ids[i]];
      var x=o&&o.totals?o.totals[f.k]:null;
      if(typeof x==='number'){ pv=x; pvMid=ids[i]; break; }
    }
    if(v==null && pv==null) return '';
    var gap = (pvMid && cut>0 && pvMid!==ids[cut-1]);
    return '<div class="kpi"><div class="l">'+esc(f.l)+'</div>'+
      '<div class="v">'+ed(base()+'.totals.'+f.k, v, f.unit)+'</div>'+
      delta(v,pv,'up')+
      (typeof pv==='number'
        ? '<div class="pv">было '+fmt(pv,f.unit)+(gap?' ('+esc(monthLabel(pvMid))+')':'')+'</div>'
        : '')+'</div>';
  }).join('')+'</div>';

  html+=smmBlock(c);
  html+=promoBlock();

  html+=retBlock(c);

  html+=topSendsBlock(c);
  return html;
}

function num(v){ return typeof v==='number'?v:null; }
function shorten(s){ s=String(s||''); return s.length>16 ? s.slice(0,15)+'…' : s; }

function dmini(v,pv){
  if(typeof v!=='number') return '';
  if(typeof pv!=='number') return '<span class="dmini new" title="новое в этом месяце">NEW</span>';
  if(pv===0) return v>0 ? '<span class="dmini up">▲</span>' : '';
  var dp=(v-pv)/Math.abs(pv);
  if(Math.abs(dp)<0.005) return '<span class="dmini flat">→</span>';
  var cls=dp>0?'up':'down';
  return '<span class="dmini '+cls+'">'+(dp>0?'▲':'▼')+Math.abs(Math.round(dp*100))+'%</span>';
}
function col2(){
  var g=D.geos.filter(function(x){ return x.id===STATE.geo; })[0];
  return (g && typeof g.col2==='string') ? g.col2 : 'Клики';

function promoBlock(){
  var ids=D.months.map(function(m){return m.id;});

    var map={};
    ((geo[mid]||{}).promos||[]).forEach(function(p,idx){ map[p.name]=({p:p,idx:idx}); });

  });
  var names=[], seen={};

    Object.keys(byMonth[mid]).forEach(function(n){ if(!seen[n]){ seen[n]=1; names.push(n); } });

  var prevM = win.length>1 ? win[win.length-2] : null;
  var curVal=function(n){
    var e=byMonth[cm][n];

    var v=num(e.p.users);
    return (typeof v==='number')?v:-1;

  var maxVal=function(n){

    win.forEach(function(mid){

    });

  names.sort(function(a,b){
    var d=curVal(b)-curVal(a);

  var isCur=function(k){ return k===win.length-1; };

  var c2=function(k){ return 'num mgrp'+(isCur(k)?' mcur':''); };
  var c3=function(k){ return 'num'+(isCur(k)?' mcur':''); };

  var head2='<tr>'+win.map(function(mid,k){
      return '<th class="'+c2(k)+'">Участ.</th>'+(two?'<th class="'+c3(k)+'">'+esc(col2())+'</th>':'');
    }).join('')+'</tr>';

  var tot={};

  var body=names.map(function(n){
    var meta=null, metaMid=null;
    win.slice().reverse().forEach(function(mid){ if(!meta&&byMonth[mid][n]){ meta=byMonth[mid][n]; metaMid=mid; } });
    var mb='data.'+STATE.geo+'.'+metaMid+'.promos.'+meta.idx;
    var prevMid = win.length>1 ? win[win.length-2] : null;
    var cells=win.map(function(mid,k){
      var e=byMonth[mid][n];
      if(!e) return '<td class="'+c2(k)+'" style="color:var(--ink-faint)">—</td>'+
                    (two?'<td class="'+c3(k)+'" style="color:var(--ink-faint)">—</td>':'');
      tot[mid].u+=num(e.p.users)||0; tot[mid].o+=num(e.p.ops)||0;
      var pb='data.'+STATE.geo+'.'+mid+'.promos.'+e.idx;
      var du='', doo='';
      if(isCur(k)&&prevMid){
        var pe=byMonth[prevMid][n];
        du = dmini(num(e.p.users), pe?num(pe.p.users):null);
        doo= dmini(num(e.p.ops),   pe?num(pe.p.ops):null);
      }
      return '<td class="'+c2(k)+'">'+ed(pb+'.users',e.p.users,'')+du+'</td>'+
             (two?'<td class="'+c3(k)+'">'+ed(pb+'.ops',e.p.ops,'')+doo+'</td>':'');
    }).join('');
    var inCur=!!byMonth[cm][n];
    return '<tr><td class="name">'+ed(mb+'.name',meta.p.name,'text')+'</td>'+
      '<td>'+ed(mb+'.type',meta.p.type,'text')+'</td>'+
      '<td>'+ed(mb+'.vertical',meta.p.vertical,'text')+'</td>'+cells+
      '<td>'+(inCur?'<button class="rowdel" data-del="data.'+STATE.geo+'.'+cm+'.promos|'+byMonth[cm][n].idx+'">×</button>':'')+'</td></tr>';
  }).join('');

  var pm = win.length>1 ? win[win.length-2] : null;
  var foot='<tr style="background:var(--accent-soft);font-weight:700"><td>Итого</td><td></td><td></td>'+win.map(function(mid,k){
    var du = (isCur(k)&&pm) ? dmini(tot[mid].u, tot[pm].u) : '';
    var doo= (isCur(k)&&pm) ? dmini(tot[mid].o, tot[pm].o) : '';
    return '<td class="'+c2(k)+'">'+fmt(tot[mid].u,'')+du+'</td>'+
           (two?'<td class="'+c3(k)+'">'+fmt(tot[mid].o,'')+doo+'</td>':'');
  }).join('')+'<td></td></tr>';

  var top3=names.filter(function(n){ return byMonth[cm][n]; })
    .slice(0,3).map(function(n,rank){
      var e=byMonth[cm][n], pe=prevM?byMonth[prevM][n]:null;
      var dm=dmini(num(e.p.users), pe?num(pe.p.users):null);
      return '<div class="w"><div class="l">'+(rank+1)+' место · '+esc(e.p.vertical||'—')+'</div>'+
        '<div class="v" style="font-size:16px;line-height:1.3">'+esc(e.p.name)+'</div>'+
        '<div class="s" style="font-size:15px;font-weight:700;color:var(--ink);margin-top:6px">'+

    '</table></div>'+

}

function monthStartDate(mid){
  var a=String(mid||'').split('-');
  return new Date(+a[0], (+a[1]||1)-1, 1, 0,0,0);
}
function tournEnd(period){
  var p=String(period||''); if(!p) return null;
  var yDef = +String(STATE.month||'').slice(0,4) || new Date().getFullYear();
  var re=/(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/g, m, last=null, toks=[];
  while((m=re.exec(p))){ last=m; toks.push(m); }
  if(last){
    var d=+last[1], mo=+last[2]-1, y=last[3]?+last[3]:null;
    if(y===null){
      var withYear=null;
      toks.forEach(function(t){ if(t[3]) withYear=+t[3]; });
      y = withYear!==null ? withYear : yDef;
      if(toks.length>1 && (+toks[0][2]-1) > mo) y=y+1;
    }
    return new Date(y, mo, d, 23,59,59);
  }
  var MN=[['январ',0],['феврал',1],['март',2],['апрел',3],['мая',4],['май',4],['июн',5],
          ['июл',6],['август',7],['сентябр',8],['октябр',9],['ноябр',10],['декабр',11]];
  var low=p.toLowerCase(), yy=/(\d{4})/.exec(p); yy=yy?+yy[1]:yDef;
  for(var i=0;i<MN.length;i++){
    if(low.indexOf(MN[i][0])>=0) return new Date(yy, MN[i][1]+1, 0, 23,59,59);
  }
  return null;
}
function secTourn(){
  if(!D.tournaments) D.tournaments={};
  if(!D.tournaments[STATE.geo]) D.tournaments[STATE.geo]=[];
  var allRows=D.tournaments[STATE.geo], b='tournaments.'+STATE.geo;

  var win=ids.slice(0, cut<0?ids.length:cut+1).slice(-2);
  var winStart=monthStartDate(win[0]), hidden=0;
  var rows=[];
  allRows.forEach(function(t,i){
    var e=tournEnd(t.period);
    if(e!==null && e<winStart){ hidden++; return; }
    rows.push({t:t,i:i});
  });
  var tot={}; win.forEach(function(mid){ tot[mid]={p:0,u:0}; });
  var isCur=function(k){ return k===win.length-1; };
  var c1=function(k){ return 'mgrp mhead'+(isCur(k)?' mcur':''); };
  var c2=function(k){ return 'num mgrp'+(isCur(k)?' mcur':''); };
  var c3=function(k){ return 'num'+(isCur(k)?' mcur':''); };
  var prevMid = win.length>1 ? win[win.length-2] : null;

  var html='<div class="sec-head"><h2>Казино</h2><div class="hint">Список турниров по гео. Участники — по месяцам, чтобы видеть, как идёт активность. Завершённые до начала показанных месяцев скрываются сами — по полю «Период»</div></div>';
  html+='<div class="card full"><div class="t-wrap"><table><thead>'+
    '<tr><th rowspan="2">Турнир / активность</th><th rowspan="2">Период</th>'+
      win.map(function(mid,k){ return '<th class="'+c1(k)+'" colspan="2">'+esc(monthLabel(mid))+'</th>'; }).join('')+
      '<th rowspan="2"></th></tr>'+
    '<tr>'+win.map(function(mid,k){
      return '<th class="'+c2(k)+'">Участ.</th><th class="'+c3(k)+'">Использ.</th>';
    }).join('')+'</tr>'+
    '</thead>';
  var body=(rows.map(function(r){
      var t=r.t, i=r.i;
      var tb=b+'.'+i;
      var pbm=t.playersByMonth||{};
      var game=(t.game||STATE.editing)
        ? '<div style="font-size:12px;color:var(--ink-faint);margin-top:2px">'+ed(tb+'.game',t.game,'text')+'</div>' : '';
      var ubm=t.usesByMonth||{};
      win.forEach(function(mid){
        if(typeof pbm[mid]==='number') tot[mid].p+=pbm[mid];
        if(typeof ubm[mid]==='number') tot[mid].u+=ubm[mid];
      });
      var cells=win.map(function(mid,k){
        var v=pbm[mid], u=ubm[mid], dm='', du='';
        if(isCur(k)&&prevMid){
          if(typeof v==='number') dm=dmini(v, typeof pbm[prevMid]==='number'?pbm[prevMid]:null);
          if(typeof u==='number') du=dmini(u, typeof ubm[prevMid]==='number'?ubm[prevMid]:null);
        }
        var uCell = ed(tb+'.usesByMonth.'+mid,(typeof u==='number'?u:null),'')+du;
        return '<td class="'+c2(k)+'">'+ed(tb+'.playersByMonth.'+mid,(typeof v==='number'?v:null),'')+dm+'</td>'+
               '<td class="'+c3(k)+'">'+uCell+'</td>';
      }).join('');
      return '<tr><td class="name">'+ed(tb+'.name',t.name,'text')+game+'</td>'+
        '<td>'+ed(tb+'.period',t.period,'text')+'</td>'+cells+
        '<td><button class="rowdel" data-del="'+b+'|'+i+'">×</button></td></tr>';
    }).join('') || '<tr><td colspan="'+(3+win.length*2)+'" class="empty">Турниров пока нет</td></tr>');
  var foot = rows.length
    ? '<tr style="background:var(--accent-soft);font-weight:700"><td>Итого участников за месяц</td><td></td>'+
      win.map(function(mid,k){
        var ok=isCur(k)&&prevMid;
        var dp=(ok&&tot[mid].p&&tot[prevMid].p)?dmini(tot[mid].p, tot[prevMid].p):'';
        var du=(ok&&tot[mid].u&&tot[prevMid].u)?dmini(tot[mid].u, tot[prevMid].u):'';
        return '<td class="'+c2(k)+'">'+(tot[mid].p?fmt(tot[mid].p,''):'—')+dp+'</td>'+
               '<td class="'+c3(k)+'">'+(tot[mid].u?fmt(tot[mid].u,''):'—')+du+'</td>';
      }).join('')+'<td></td></tr>'
    : '';
  html+='<tbody>'+foot+body+'</tbody>'+
    '</table></div><button class="btn addrow" data-add="tourn">+ Добавить турнир</button>'+
    (hidden?'<div style="margin-top:8px;font-size:12px;color:var(--ink-faint)">Скрыто завершённых: '+hidden+'. Они остаются в данных — видно при переключении на их месяц</div>':'')+
    '</div>';
  return html;
}

function agentsBoard(){
  if(!D.agentsBoard) D.agentsBoard={};
  if(!D.agentsBoard[STATE.geo]) D.agentsBoard[STATE.geo]={};
  var o=D.agentsBoard[STATE.geo];
  ['sends','tests','legacy'].forEach(function(k){ if(!o[k]) o[k]=[]; });
  if(typeof o.period!=='string') o.period='';
  if(typeof o.reachNote!=='string') o.reachNote='';
  if(typeof o.summary!=='string') o.summary='';
  if(!o.reach) o.reach={};
  if(!o.reach.ret) o.reach.ret={sent:null,cr:null};
  ['smm','banner'].forEach(function(k){ if(!o.reach[k]) o.reach[k]={sent:null,clicks:null}; });
  if(o.reach.retClicks===undefined) o.reach.retClicks=null;
  if(!o.leads) o.leads={};
  ['ret','banner','smm'].forEach(function(k){
    if(!o.leads[k]) o.leads[k]={leads:null,joined:null,interested:null,notInterested:null,noResponse:null};
  });
  return o;
}
function secAgents(){
  var o=agentsBoard();

    ed(b+'.period',o.period,'text')+' — проценты и итоги считаются сами</div></div>';

  // ---------- 1. охват и переходы ----------
  var retSent=num(R.ret.sent)||0;
  var retCr=num(R.ret.cr);
  var retCrPct = retSent>0 && typeof retCr==='number' ? retCr/retSent : null;
  var retClicks=num(R.retClicks);
  var retCtr = retSent>0 && typeof retClicks==='number' ? retClicks/retSent : null;
  var allSent = retSent+(num(R.smm.sent)||0)+(num(R.banner.sent)||0);
  var allClicks = (typeof retClicks==='number'?retClicks:0)+(num(R.smm.clicks)||0)+(num(R.banner.clicks)||0);
  var allCtr = allSent>0 && allClicks ? allClicks/allSent : null;

  // ---------- 2. лиды и результат ----------
  var clicksOf={ret:(typeof retClicks==='number'?retClicks:null), banner:num(R.banner.clicks), smm:num(R.smm.clicks)};
  var T={leads:0,joined:0,interested:0,notInterested:0,noResponse:0,invalid:0,nostatus:0,clicks:0};
  var leadRow=function(key,label){

        nr=num(x.noResponse)||0, iv=num(x.invalid)||0;
    var nostatus=lead?Math.max(0,lead-(j+i1+n1+nr+iv)):0;

    T.leads+=lead; T.joined+=j; T.interested+=i1; T.notInterested+=n1; T.noResponse+=nr;

      '<td class="num">'+ed(lb+'.interested',x.interested,'')+'</td>'+
      '<td class="num">'+ed(lb+'.notInterested',x.notInterested,'')+'</td>'+
      '<td class="num">'+ed(lb+'.noResponse',x.noResponse,'')+'</td>'+
      '<td class="num">'+ed(lb+'.invalid',x.invalid,'')+'</td>'+
      '<td class="num">'+(lead?fmt(nostatus,''):'—')+'</td>'+

      '<td class="num">'+(p2==null?'—':fmt(p2,'%'))+'</td></tr>';
  };
  var body=leadRow('ret','Ретеншен')+leadRow('banner','Баннер на сайте')+leadRow('smm','СММ');
  var t1=T.leads>0?T.joined/T.leads:null, t2=(T.clicks&&T.leads)?T.leads/T.clicks:null;

  html+='<div class="card full"><h3>Лиды и результат · накопительно, по базе лидов</h3>'+
    '<div class="t-wrap"><table><thead><tr><th>Канал</th><th class="num">Лидов</th>'+
    '<th class="num">Joined as partner</th><th class="num">Interested</th><th class="num">Not interested</th>'+
    '<th class="num">No response</th><th class="num">Invalid contacts</th><th class="num">Без статуса</th>'+
    '<th class="num">% лид → партнёр</th><th class="num">% переход → лид</th></tr></thead><tbody>'+
    body+'</tbody><tfoot><tr><td>ИТОГО</td>'+
      '<td class="num">'+fmt(T.leads,'')+'</td><td class="num">'+fmt(T.joined,'')+'</td>'+
      '<td class="num">'+fmt(T.interested,'')+'</td><td class="num">'+fmt(T.notInterested,'')+'</td>'+
      '<td class="num">'+fmt(T.noResponse,'')+'</td><td class="num">'+fmt(T.invalid,'')+'</td>'+
      '<td class="num">'+fmt(T.nostatus,'')+'</td>'+
      '<td class="num">'+(t1==null?'—':fmt(t1,'%'))+'</td>'+
      '<td class="num">'+(t2==null?'—':fmt(t2,'%'))+'</td></tr></tfoot></table></div>'+
    '<div style="margin-top:10px;font-size:12.5px;color:var(--ink-faint)">«Без статуса» считается само: лиды минус все статусы. Цель — 0. Если больше 0, в таблице лидов есть необработанные строки.</div>'+
    ((o.leadsNote||STATE.editing)?'<div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft)">'+ed(b+'.leadsNote',o.leadsNote,'text')+'</div>':'')+'</div>';

function enableEdit(){
  var nodes=document.querySelectorAll('#app [data-path]');
  for(var i=0;i<nodes.length;i++){
    nodes[i].setAttribute('contenteditable','true');
    nodes[i].setAttribute('spellcheck','false');
  }
}

/* ---------- events ---------- */
document.body.addEventListener('click', function(e){
  var g=e.target.closest('[data-geo]');
  if(g){ STATE.geo=g.getAttribute('data-geo'); render(); window.scrollTo(0,0); return; }
  var t=e.target.closest('[data-tab]');
  if(t){ STATE.tab=t.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
  var d=e.target.closest('[data-del]');
  if(d){
    var pr=d.getAttribute('data-del').split('|');
    var arr=getPath(pr[0]);
    if(arr&&arr.splice){ arr.splice(parseInt(pr[1],10),1); render(); }
    return;
  }
  var a=e.target.closest('[data-add]');
  if(a){ addItem(a.getAttribute('data-add')); return; }
});
document.getElementById('monthSel').addEventListener('change', function(e){
  STATE.month=e.target.value; render(); window.scrollTo(0,0);
});
document.getElementById('editBtn').addEventListener('click', function(){
  STATE.editing=!STATE.editing; render();
});
document.getElementById('dlBtn').addEventListener('click', downloadHtml);
document.getElementById('moreBtn').addEventListener('click', more);

document.getElementById('app').addEventListener('blur', function(e){
  var el=e.target;
  if(!el.getAttribute||!el.getAttribute('data-path')) return;
  var path=el.getAttribute('data-path'), type=el.getAttribute('data-type');
  var raw=el.textContent.trim();
  if(type==='num'){ setPath(path, parseNum(raw)); }
  else if(type==='pct'){
    var n=parseNum(raw);
    setPath(path, n==null?null:(raw.indexOf('%')>=0||n>1 ? n/100 : n));
  }
  else setPath(path, raw);
  render();
}, true);

function ensureMonth(){
  if(!D.data[STATE.geo]) D.data[STATE.geo]={};
  if(!D.data[STATE.geo][STATE.month]){
    D.data[STATE.geo][STATE.month]={totals:{},promos:[],tournaments:[],
      vip:{title:'ВИП рассылки',segments:[],notes:[]},agents:[],channels:[],smm:[],topSport:[],topCasino:[],reactivation:[],
      retention:{metrics:[],better:[],worse:[],hypotheses:[]},projects:[],plans:[]};
  }
  var c=D.data[STATE.geo][STATE.month];
  if(!c.vip) c.vip={title:'ВИП рассылки',segments:[],notes:[]};
  if(!c.vip.segments) c.vip.segments=[];
  if(!c.vip.notes) c.vip.notes=[];
  if(!c.agents) c.agents=[];
  if(!c.channels) c.channels=[];
  if(!c.smm) c.smm=[];
  if(!c.topSport) c.topSport=[];
  if(!c.topCasino) c.topCasino=[];
  if(!c.reactivation) c.reactivation=[];
  if(!c.retention) c.retention={metrics:[],better:[],worse:[],hypotheses:[]};
  ['promos','tournaments','projects','plans'].forEach(function(k){ if(!c[k]) c[k]=[]; });
  ['metrics','better','worse','hypotheses','channels'].forEach(function(k){ if(!c.retention[k]) c.retention[k]=[]; });
  return c;
}
function addItem(kind){
  var c=ensureMonth();
  if(kind==='promo') c.promos.push({name:'Новое промо',period:'',spend:0,revenue:0,users:0,ops:0,newUsers:0,note:''});
  else if(kind==='tourn'){
    if(!D.tournaments) D.tournaments={};
    if(!D.tournaments[STATE.geo]) D.tournaments[STATE.geo]=[];
    D.tournaments[STATE.geo].push({name:'Новый турнир',game:'',period:'',playersByMonth:{},usesByMonth:{}});
  }
  else if(kind==='better') c.retention.better.push('Что улучшилось');
  else if(kind==='worse') c.retention.worse.push('Что ухудшилось');
  else if(kind==='hyp') c.retention.hypotheses.push({found:'Что обнаружили',actions:['Действие'],got:'Что получили',next:'Следующая гипотеза',status:'В работе'});
  else if(kind.indexOf('action:')===0){
    var idx=parseInt(kind.split(':')[1],10);
    if(c.retention.hypotheses[idx]){
      if(!c.retention.hypotheses[idx].actions) c.retention.hypotheses[idx].actions=[];
      c.retention.hypotheses[idx].actions.push('Действие');
    }
  }
  else if(kind==='proj') c.projects.push({title:'Новый проект',why:'',expected:'',result:'',change:'',status:'В работе'});
  else if(kind==='plan') c.plans.push({title:'Новая инициатива',why:'',expected:'',status:'План'});
  else if(kind==='vipseg') c.vip.segments.push({name:'Новый сегмент',issued:0,used:0});
  else if(kind==='vipnote') c.vip.notes.push('Что менять');
  else if(kind.indexOf('topsend:')===0){
    var tk=kind.split(':')[1];
    if(!c.retention) c.retention={};
    if(!c.retention.topSends) c.retention.topSends={pm:[],push:[],email:[]};
    if(!c.retention.topSends[tk]) c.retention.topSends[tk]=[];
    c.retention.topSends[tk].push({date:'',name:'',delivered:null,read:null,clicks:null});
  }
  else if(kind==='sendstat'){
    if(!c.retention) c.retention={};
    if(!c.retention.sendStats) c.retention.sendStats=[];
    c.retention.sendStats.push({channel:'',sent:null,clicks:null});
  }
  else if(kind==='smm') c.smm.push({network:'',followers:{plan:null,fact:null},reach:{plan:null,fact:null},
      posts:{plan:null,fact:null},reactions:{plan:null,fact:null},er:{plan:null,fact:null}});
  else if(kind==='channel') c.channels.push({channel:'Канал',metric:'Click Rate',value:null,delta:null});
  else if(kind==='topSport') c.topSport.push({name:'',channel:'',sent:null,cr:null,clicks:null,pm:null,push:null,emailOR:null,emailCR:null});
  else if(kind==='topCasino') c.topCasino.push({name:'',channel:'',sent:null,cr:null,clicks:null,pm:null,push:null,emailOR:null,emailCR:null});
  else if(kind==='reactivation') c.reactivation.push({vertical:'',segment:'10+',inactivity:'',base:null,activated:null,ctr:null,arppu:null,profit:null});
  else if(kind==='agent') c.agents.push({name:'Новая рассылка',clicks:0,regs:0,ftd:0,ftdSum:0,note:''});
  STATE.editing=true; render();
}

function more(){
  var choice=prompt(
    'Что сделать?\n'+
    '1 — добавить новый месяц\n'+
    '2 — скачать данные в JSON (чтобы прислать в чат)\n'+
    '3 — загрузить данные из JSON\n'+
    '4 — убрать пометку «демо-данные»\n\n'+
    'Введите цифру:');
  if(choice==='1'){
    var label=prompt('Название месяца, например: Август 2026');
    if(!label) return;
    var id=prompt('Короткий код месяца (для сортировки), например: 2026-08','');
    if(!id) return;
    if(!D.months.some(function(m){return m.id===id;})) D.months.push({id:id,label:label});
    D.months.sort(function(a,b){ return a.id<b.id?-1:1; });
    D.geos.forEach(function(g){
      if(!D.data[g.id]) D.data[g.id]={};
      if(!D.data[g.id][id]) D.data[g.id][id]={totals:{},promos:[],tournaments:[],
        vip:{title:'ВИП рассылки',segments:[],notes:[]},agents:[],channels:[],smm:[],topSport:[],topCasino:[],reactivation:[],agentSends:[],agentTests:[],
        retention:{metrics:[],better:[],worse:[],hypotheses:[]},projects:[],plans:[]};
    });
    STATE.month=id; STATE.editing=true; render();
  } else if(choice==='2'){
    dl(JSON.stringify(D,null,2),'brand-dashboard-data.json','application/json');
  } else if(choice==='3'){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        try{
          var obj=JSON.parse(rd.result);
          if(!obj.data||!obj.geos||!obj.months) throw new Error('нет полей data / geos / months');
          D=obj;
          STATE.geo=D.geos[0].id; STATE.month=D.months[D.months.length-1].id;
          render();
        }catch(err){ alert('Файл не подошёл: '+err.message+'. Нужен JSON, выгруженный этим же дашбордом.'); }
      };
      rd.readAsText(f,'utf-8');
    };
    inp.click();
  } else if(choice==='4'){
    D.meta.demo=false; render();
  }
}

function dl(text,name,mime){
  var blob=new Blob([text],{type:mime+';charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function downloadHtml(){
  D.meta.updated = new Date().toISOString().slice(0,10);
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML='';
  clone.querySelector('#tabs').innerHTML='';
  clone.querySelector('#geoSeg').innerHTML='';
  clone.querySelector('#monthSel').innerHTML='';
  clone.querySelector('#foot').innerHTML='';
  clone.querySelector('#data').textContent=JSON.stringify(D,null,2);
  clone.className='';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  var name='brand-dashboard-'+STATE.month+'.html';
  dl(html,name,'text/html');
}

render();
})();
</script>
